# Releases with release-plz (.config/release-plz.toml). On every push to
# main, `release-pr` opens or updates the release PR (version bumps and
# changelogs). Merging that PR is the authorization: `release` then
# publishes the bumped crates to crates.io (trusted publishing) and pushes
# their `<crate>/v<version>` tags, which start tag.yml. On other pushes,
# `release` does nothing (release_always = false).
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-pr:
    uses: lsdocs/.github/.github/workflows/release-pr.yml@main
    permissions:
      contents: read
    secrets:
      app-id: ${{ secrets.RELEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # crates.io trusted publishing
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The App's token (not GITHUB_TOKEN), so the tags it pushes start
      # tag.yml.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          config: .config/release-plz.toml
          token: ${{ steps.app-token.outputs.token }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
